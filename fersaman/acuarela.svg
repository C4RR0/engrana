<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- bordes irregulares de pincel de acuarela -->
    <filter id="pincel" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.06" numOctaves="3" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="38" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
    <filter id="pincel2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="2" seed="21" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="30" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
  </defs>
  <rect width="1600" height="760" fill="#FFFFFF"/>
  <g id="trazos">
  <g filter="url(#pincel)" opacity=".9">
    <!-- esquina izquierda -->
    <rect x="-260" y="40" width="760" height="120" rx="50" fill="#E85A9C" transform="rotate(-35 120 100)"/>
    <rect x="-300" y="210" width="720" height="110" rx="50" fill="#8E5CB8" opacity=".85" transform="rotate(-35 60 260)"/>
    <rect x="-280" y="380" width="640" height="100" rx="45" fill="#46B8B0" opacity=".8" transform="rotate(-35 40 430)"/>
    <rect x="-200" y="560" width="600" height="95" rx="45" fill="#F6CF3F" opacity=".9" transform="rotate(-35 100 610)"/>
    <!-- esquina derecha -->
    <rect x="1180" y="-120" width="700" height="115" rx="50" fill="#F29A48" opacity=".9" transform="rotate(-35 1530 -60)"/>
    <rect x="1240" y="120" width="680" height="110" rx="50" fill="#E85A9C" opacity=".85" transform="rotate(-35 1580 175)"/>
    <rect x="1260" y="380" width="660" height="105" rx="45" fill="#8E5CB8" opacity=".8" transform="rotate(-35 1590 430)"/>
    <rect x="1220" y="610" width="640" height="100" rx="45" fill="#46B8B0" opacity=".85" transform="rotate(-35 1540 660)"/>
  </g>
  <g filter="url(#pincel2)" opacity=".55">
    <rect x="-120" y="140" width="520" height="60" rx="30" fill="#F6CF3F" transform="rotate(-35 140 170)"/>
    <rect x="1300" y="260" width="520" height="55" rx="28" fill="#F6CF3F" transform="rotate(-35 1560 290)"/>
    <rect x="1290" y="520" width="480" height="50" rx="25" fill="#F29A48" transform="rotate(-35 1530 545)"/>
    <rect x="-140" y="470" width="480" height="55" rx="28" fill="#E85A9C" transform="rotate(-35 100 500)"/>
  </g>
  </g>
  <!-- copias arriba y abajo: el fondo se repite en vertical sin cortes -->
  <use href="#trazos" y="-760"/>
  <use href="#trazos" y="760"/>
</svg>
