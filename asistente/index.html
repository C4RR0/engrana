<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --c: #2F5D58; --bg: #F6F3EF; --card: #FFFFFF; --ink: #1E2326; --muted: #6B7378; --line: #E4DED7; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .app { max-width: 640px; margin: 0 auto; height: 100%; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; letter-spacing: .02em; }
  header b { display: block; font-size: 1rem; }
  header span { font-size: .8rem; color: var(--muted); }
  header span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3BB273; margin-right: 6px; vertical-align: 1px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-line; overflow-wrap: anywhere; }
  .bot { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; align-self: flex-start; }
  .user { background: var(--c); color: #fff; border-bottom-right-radius: 6px; align-self: flex-end; }
  .typing { align-self: flex-start; color: var(--muted); font-size: .85rem; padding: 0 4px; }
  .aviso { align-self: center; text-align: center; font-size: .78rem; color: var(--muted); max-width: 30em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
  .chip { font: 500 .88rem Inter, sans-serif; color: var(--c); background: var(--card); border: 1px solid var(--c); border-radius: 999px; padding: .45em .9em; cursor: pointer; }
  form.send { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  form.send input { flex: 1; min-width: 0; font: 400 16px Inter, sans-serif; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: .65em 1em; }
  form.send input:focus, .ficha input:focus, .ficha textarea:focus { outline: 2px solid var(--c); outline-offset: -1px; }
  form.send button { flex: none; font: 600 .95rem Inter, sans-serif; border: 0; border-radius: 22px; padding: 0 1.1em; background: var(--c); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .ficha { align-self: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .ficha b { font-size: .95rem; }
  .ficha label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
  .ficha input, .ficha textarea, .ficha select { font: 400 16px Inter, sans-serif; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .55em .7em; width: 100%; }
  .ficha textarea { min-height: 70px; resize: vertical; }
  .ficha .ok { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: .8rem; }
  .ficha .ok input { width: auto; margin-top: 3px; }
  .ficha .hp { position: absolute; left: -9999px; }
  .ficha button { font: 600 .95rem Inter, sans-serif; border: 0; border-radius: 10px; padding: .75em; background: var(--c); color: #fff; cursor: pointer; }
  .ficha .err { color: #B3261E; font-size: .82rem; margin: 0; }
  footer { text-align: center; font-size: .72rem; color: var(--muted); padding: 6px 0 0; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar">·</div>
    <div><b id="nombre">Asistente</b><span>Contesta al momento, 24 h</span></div>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="send" id="send">
    <input id="txt" autocomplete="off" placeholder="Escribe tu mensaje…" aria-label="Escribe tu mensaje" maxlength="600">
    <button type="submit" id="btn">Enviar</button>
  </form>
  <footer>Asistente automático · <a href="https://engranaia.com" target="_blank" rel="noopener">Engrana</a></footer>
</div>

<script>
  // URL /exec de la aplicación web de Apps Script (apps-script.gs).
  const API_POR_DEFECTO = 'PENDIENTE_URL_EXEC';
  const qs = new URLSearchParams(location.search);
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API = (local && qs.get('api')) || API_POR_DEFECTO;
  const CLIENTE = (qs.get('c') || document.documentElement.dataset.cliente || '').replace(/[^\w-]/g, '');

  const $ = (id) => document.getElementById(id);
  const msgs = $('msgs'), chips = $('chips'), txt = $('txt'), btn = $('btn');
  const historial = [];
  let ficha = null, ocupado = false, nMsg = 0;
  let conv;
  try { conv = sessionStorage.getItem('conv'); } catch (e) {}
  if (!conv) {
    conv = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { sessionStorage.setItem('conv', conv); } catch (e) {}
  }

  function abajo() { msgs.scrollTop = msgs.scrollHeight; }
  function burbuja(texto, quien) {
    const d = document.createElement('div');
    d.className = 'msg ' + quien; d.textContent = texto;
    msgs.appendChild(d); abajo();
  }
  function nota(texto) {
    const d = document.createElement('div'); d.className = 'aviso'; d.textContent = texto; msgs.appendChild(d);
  }
  function ponerChips(lista) {
    chips.innerHTML = '';
    (lista || []).forEach((t) => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = t;
      b.addEventListener('click', () => enviar(t));
      chips.appendChild(b);
    });
  }
  function bloquear(si) { ocupado = si; btn.disabled = si; }

  async function llamar(cuerpo) {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(cuerpo) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function enviar(texto) {
    texto = String(texto || '').trim();
    if (!texto || ocupado) return;
    burbuja(texto, 'user'); ponerChips([]);
    historial.push({ r: 'u', x: texto });
    nMsg++;
    if (nMsg === 1 && window.engranaEv) window.engranaEv('asistente-chat');
    bloquear(true);
    const t = document.createElement('div'); t.className = 'typing'; t.textContent = 'escribiendo…';
    msgs.appendChild(t); abajo();
    let r;
    try {
      r = await llamar({ t: 'chat', c: CLIENTE, conv, h: historial.slice(-12) });
    } catch (e) {
      r = { texto: 'Perdona, no me llega bien la conexión. Prueba otra vez en un momento o déjale tu duda al centro.', chips: [], accion: 'formulario_duda' };
    }
    t.remove();
    burbuja(r.texto, 'bot');
    historial.push({ r: 'a', x: r.texto });
    if (r.accion === 'formulario_cita') formulario('cita', texto);
    else if (r.accion === 'formulario_duda') formulario('duda', texto);
    ponerChips(r.chips);
    bloquear(false);
    txt.focus();
  }

  function campo(etiqueta, el) {
    const l = document.createElement('label'); l.textContent = etiqueta; l.appendChild(el); return l;
  }
  function entrada(tipo, nombre, attrs) {
    const i = document.createElement(tipo === 'textarea' ? 'textarea' : 'input');
    if (tipo !== 'textarea') i.type = tipo;
    i.name = nombre; Object.assign(i, attrs || {});
    return i;
  }

  function formulario(tipo, ultimo) {
    const viejo = document.querySelector('.ficha'); if (viejo) viejo.remove();
    const f = document.createElement('form'); f.className = 'ficha'; f.noValidate = true;
    const titulo = document.createElement('b');
    titulo.textContent = tipo === 'cita' ? '📅 Solicitud de cita' : '💬 Tu duda para el centro';
    f.appendChild(titulo);

    if (tipo === 'cita') {
      const lista = (ficha.ui && ficha.ui.tratamientos) || [];
      const tr = entrada('text', 'tratamiento', { maxLength: 120, placeholder: 'Por ejemplo: limpieza facial' });
      if (lista.length) {
        const dl = document.createElement('datalist'); dl.id = 'trat';
        lista.forEach((x) => { const o = document.createElement('option'); o.value = x; dl.appendChild(o); });
        f.appendChild(dl); tr.setAttribute('list', 'trat');
      }
      f.appendChild(campo('Tratamiento', tr));
      f.appendChild(campo('Días u horas que te vienen bien', entrada('text', 'preferencia', { maxLength: 200, placeholder: 'Por ejemplo: martes o jueves por la tarde' })));
    } else {
      f.appendChild(campo('Tu duda', entrada('textarea', 'mensaje', { maxLength: 800, value: ultimo || '' })));
    }
    f.appendChild(campo('Nombre', entrada('text', 'nombre', { maxLength: 80, autocomplete: 'given-name', required: true })));
    f.appendChild(campo('Teléfono o WhatsApp', entrada('tel', 'contacto', { maxLength: 80, autocomplete: 'tel', required: true })));
    const hp = entrada('text', 'web', { tabIndex: -1, autocomplete: 'off' }); hp.className = 'hp'; hp.setAttribute('aria-hidden', 'true');
    f.appendChild(hp);

    const ok = document.createElement('label'); ok.className = 'ok';
    const chk = entrada('checkbox', 'acepto');
    ok.appendChild(chk);
    ok.appendChild(document.createTextNode('Acepto que ' + ficha.nombre + ' use estos datos solo para contestarme sobre esta solicitud.'));
    f.appendChild(ok);

    const err = document.createElement('p'); err.className = 'err'; f.appendChild(err);
    const enviarBtn = document.createElement('button'); enviarBtn.type = 'submit';
    enviarBtn.textContent = tipo === 'cita' ? 'Enviar solicitud' : 'Enviar duda';
    f.appendChild(enviarBtn);

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = (n) => (f.elements[n] ? f.elements[n].value.trim() : '');
      if (v('web')) return;
      if (!v('nombre') || !v('contacto')) { err.textContent = 'Pon tu nombre y un teléfono para que te contesten.'; return; }
      if (!chk.checked) { err.textContent = 'Marca la casilla para poder enviarlo.'; return; }
      err.textContent = ''; enviarBtn.disabled = true; enviarBtn.textContent = 'Enviando…';
      try {
        const r = await llamar({ t: 'form', c: CLIENTE, conv, tipo, d: {
          tratamiento: v('tratamiento'), preferencia: v('preferencia'), mensaje: v('mensaje'), nombre: v('nombre'), contacto: v('contacto') } });
        if (!r.ok) { err.textContent = r.texto || 'No se ha podido enviar.'; enviarBtn.disabled = false; enviarBtn.textContent = 'Reintentar'; return; }
        f.remove();
        burbuja(r.texto, 'bot');
        if (window.engranaEv) window.engranaEv(tipo === 'cita' ? 'asistente-cita' : 'asistente-duda');
      } catch (e2) {
        err.textContent = 'No se ha podido enviar. Revisa la conexión y prueba otra vez.';
        enviarBtn.disabled = false; enviarBtn.textContent = 'Reintentar';
      }
    });
    msgs.appendChild(f); abajo();
  }

  $('send').addEventListener('submit', (e) => { e.preventDefault(); const t = txt.value; txt.value = ''; enviar(t); });

  async function iniciar() {
    if (!CLIENTE) { burbuja('Falta el nombre del negocio en el enlace.', 'bot'); bloquear(true); return; }
    try {
      const r = await fetch('clientes/' + CLIENTE + '.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error();
      ficha = await r.json();
    } catch (e) {
      burbuja('Este asistente no está disponible.', 'bot'); bloquear(true); return;
    }
    const ui = ficha.ui || {};
    document.title = ficha.nombre + ' · Asistente';
    if (ui.color) document.documentElement.style.setProperty('--c', ui.color);
    $('nombre').textContent = ficha.nombre;
    $('avatar').textContent = ui.iniciales || ficha.nombre.slice(0, 2).toUpperCase();
    nota('Asistente automático. Para pedir cita te saldrá un formulario: no escribas en el chat datos de salud ni personales.' + (ficha.demo ? ' Centro de ejemplo: los datos son inventados.' : ''));
    const hola = ui.bienvenida || '¡Hola! 👋 ¿En qué te ayudo?';
    burbuja(hola, 'bot');
    historial.push({ r: 'a', x: hola });
    ponerChips(ui.chips || []);
  }
  iniciar();
</script>
<script defer src="../m.js" data-site="engrana" data-api="https://script.google.com/macros/s/AKfycbxUQt_fUgS_BEP-gdpqzNt1EqRblhiBikMZr5ThNytjFnjY_kvcknVICwr1iis0NjyO/exec"></script>
</body>
</html>
